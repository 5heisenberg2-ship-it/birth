<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Om Prakash 👀</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  overflow:hidden; color:#fff; font-family:Arial,sans-serif;
  background:#090914;
}
.bg{
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 20% 20%,#5b21b6 0,transparent 30%),
    radial-gradient(circle at 80% 80%,#be185d 0,transparent 30%),
    radial-gradient(circle at 50% 50%,#111827 0,transparent 60%);
  animation:pulse 6s ease-in-out infinite alternate;
}
.card{
  position:relative; z-index:2; width:min(92vw,650px);
  padding:38px 25px; text-align:center; border-radius:30px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 25px 100px rgba(0,0,0,.55);
  backdrop-filter:blur(18px);
}
.small{font-size:.8rem;letter-spacing:4px;opacity:.55;text-transform:uppercase}
h1{font-size:clamp(2.2rem,9vw,4.5rem);margin:15px 0 10px;line-height:1}
.sub{opacity:.7;margin:0 0 30px}
button{
  border:0;border-radius:999px;padding:15px 30px;font-size:1rem;
  font-weight:bold;cursor:pointer;background:white;color:#17121f;
  box-shadow:0 8px 30px rgba(255,255,255,.18);
}
#surprise{display:none}
#surprise h2{
  font-size:clamp(2.3rem,9vw,5rem);margin:0 0 22px;
  animation:pop .7s cubic-bezier(.2,1.5,.4,1);
}
video{width:100%;max-height:65vh;border-radius:20px;background:#000}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{to{transform:scale(1.08)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.piece{position:absolute;top:-20px;width:8px;height:15px;animation:fall 4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="bg"></div>

<div class="card" id="start">
  <div class="small">private message</div>
  <h1>Om Prakash 👀</h1>
  <p class="sub">You weren't supposed to find this yet.</p>
  <button id="open">Tap if you dare →</button>
</div>

<div class="card" id="surprise">
  <div class="small">breaking news</div>
  <h2>HAPPY BIRTHDAY<br>OM PRAKASH 🎂</h2>
  <video id="video" controls playsinline>
    <source src="birthday_video.mp4" type="video/mp4">
  </video>
</div>

<div class="confetti" id="confetti"></div>

<script>
const start=document.getElementById("start");
const surprise=document.getElementById("surprise");
const video=document.getElementById("video");
const confetti=document.getElementById("confetti");

document.getElementById("open").onclick=async()=>{
  start.style.display="none";
  surprise.style.display="block";

  for(let i=0;i<110;i++){
    const p=document.createElement("span");
    p.className="piece";
    p.style.left=Math.random()*100+"vw";
    p.style.animationDelay=Math.random()*.5+"s";
    p.style.animationDuration=2.5+Math.random()*2.5+"s";
    p.style.background=["#ff4d6d","#ffd166","#06d6a0","#60a5fa","#c084fc"][Math.floor(Math.random()*5)];
    confetti.appendChild(p);
    setTimeout(()=>p.remove(),5500);
  }

  try{await video.play()}catch(e){}
};
</script>
</body>
</html>
